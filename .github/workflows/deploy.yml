name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A live-edit publish is a push; two in quick succession must deploy in order,
# never cancel each other.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # Static site, no build. The .mov master is over Pages' 25 MiB file
      # limit and the page only uses the mp4/webm transcodes.
      - run: rsync -a --exclude .git --exclude .github --exclude '*.mov' ./ dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=queerassfolk --branch=main
